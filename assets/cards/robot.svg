<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="Motion-Capture Robot Control: Bridges a Qualisys motion-capture system with ROS to track and pilot a robot in real time, with a user interface and simulation scripts.">
  <defs>
    <radialGradient id="gl" cx="1" cy="0" r=".9">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".22"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="600" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .run { stroke-dasharray: 140 1652; animation: run 6s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -1792 } }
    .shine { animation: shine 5s ease-in-out infinite; }
    @keyframes shine { 0%,55% { transform: translateX(-300px) skewX(-20deg) } 100% { transform: translateX(900px) skewX(-20deg) } }
    .in { opacity: 0; animation: in .8s cubic-bezier(.2,.8,.2,1) forwards; }
    .d2 { animation-delay: .15s } .d3 { animation-delay: .3s }
    @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .arr { animation: arr 2.4s ease-in-out infinite; }
    @keyframes arr { 0%,100% { transform: translate(0,0) } 50% { transform: translate(4px,-4px) } }
  </style>
  <g clip-path="url(#c)">
    <rect width="600" height="300" fill="#0A0F1C"/>
    <rect width="600" height="300" fill="url(#gl)"/>
    <rect class="shine" x="0" y="-40" width="160" height="380" fill="url(#sh)"/>
    <text x="572" y="276" text-anchor="end" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="150" font-weight="900" fill="#fff" fill-opacity=".03">04</text>
  </g>
  <rect x="1" y="1" width="598" height="298" rx="20" fill="none" stroke="#1C2A44" stroke-width="1.5"/>
  <rect class="run" x="1" y="1" width="598" height="298" rx="20" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>

  <g class="in">
    <rect x="32" y="32" width="10" height="10" rx="2" fill="#A78BFA"/>
    <text x="52" y="42" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="13.5" letter-spacing="2.5" fill="#A78BFA">ROBOTICS · REAL TIME</text>
  </g>
  <g class="arr" transform="translate(0 0)">
    <path d="M544 52 L564 32 M548 32 H564 V48" fill="none" stroke="#8B98A9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="in d2" x="32" y="100" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-.4" fill="#F1F5F9">Motion-Capture Robot Control</text>
  <text class="in d3" y="146" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="18" fill="#94A3B8"><tspan x="32" dy="0">Bridges a Qualisys motion-capture system with ROS</tspan><tspan x="32" dy="27">to track and pilot a robot in real time, with a</tspan><tspan x="32" dy="27">user interface and simulation scripts.</tspan></text>
  <g class="in d3"><g transform="translate(32 248)"><rect width="54" height="30" rx="15" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".45"/><text x="27.0" y="20" text-anchor="middle" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="14" fill="#A78BFA">ROS</text></g><g transform="translate(96 248)"><rect width="100" height="30" rx="15" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".45"/><text x="50.0" y="20" text-anchor="middle" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="14" fill="#A78BFA">Robotics</text></g><g transform="translate(206 248)"><rect width="81" height="30" rx="15" fill="#A78BFA" fill-opacity=".1" stroke="#A78BFA" stroke-opacity=".45"/><text x="40.5" y="20" text-anchor="middle" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="14" fill="#A78BFA">Python</text></g></g>
</svg>
