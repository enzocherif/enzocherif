<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" role="img" aria-label="SMS Spam Classifier: Bidirectional LSTM that separates spam from legitimate SMS messages, from text preprocessing all the way to evaluation.">
  <defs>
    <radialGradient id="gl" cx="1" cy="0" r=".9">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".22"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="600" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .run { stroke-dasharray: 140 1652; animation: run 6s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -1792 } }
    .shine { animation: shine 5s ease-in-out infinite; }
    @keyframes shine { 0%,55% { transform: translateX(-300px) skewX(-20deg) } 100% { transform: translateX(900px) skewX(-20deg) } }
    .in { opacity: 0; animation: in .8s cubic-bezier(.2,.8,.2,1) forwards; }
    .d2 { animation-delay: .15s } .d3 { animation-delay: .3s }
    @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .arr { animation: arr 2.4s ease-in-out infinite; }
    @keyframes arr { 0%,100% { transform: translate(0,0) } 50% { transform: translate(4px,-4px) } }
  </style>
  <g clip-path="url(#c)">
    <rect width="600" height="300" fill="#0A0F1C"/>
    <rect width="600" height="300" fill="url(#gl)"/>
    <rect class="shine" x="0" y="-40" width="160" height="380" fill="url(#sh)"/>
    <text x="572" y="276" text-anchor="end" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="150" font-weight="900" fill="#fff" fill-opacity=".03">03</text>
  </g>
  <rect x="1" y="1" width="598" height="298" rx="20" fill="none" stroke="#1C2A44" stroke-width="1.5"/>
  <rect class="run" x="1" y="1" width="598" height="298" rx="20" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>

  <g class="in">
    <rect x="32" y="32" width="10" height="10" rx="2" fill="#00E5FF"/>
    <text x="52" y="42" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="13.5" letter-spacing="2.5" fill="#00E5FF">NLP · CLASSIFICATION</text>
  </g>
  <g class="arr" transform="translate(0 0)">
    <path d="M544 52 L564 32 M548 32 H564 V48" fill="none" stroke="#8B98A9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="in d2" x="32" y="100" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="-.4" fill="#F1F5F9">SMS Spam Classifier</text>
  <text class="in d3" y="146" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="18" fill="#94A3B8"><tspan x="32" dy="0">Bidirectional LSTM that separates spam from</tspan><tspan x="32" dy="27">legitimate SMS messages, from text preprocessing</tspan><tspan x="32" dy="27">all the way to evaluation.</tspan></text>
  <g class="in d3"><g transform="translate(32 248)"><rect width="118" height="30" rx="15" fill="#00E5FF" fill-opacity=".1" stroke="#00E5FF" stroke-opacity=".45"/><text x="59.0" y="20" text-anchor="middle" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="14" fill="#00E5FF">TensorFlow</text></g><g transform="translate(160 248)"><rect width="54" height="30" rx="15" fill="#00E5FF" fill-opacity=".1" stroke="#00E5FF" stroke-opacity=".45"/><text x="27.0" y="20" text-anchor="middle" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="14" fill="#00E5FF">NLP</text></g><g transform="translate(224 248)"><rect width="90" height="30" rx="15" fill="#00E5FF" fill-opacity=".1" stroke="#00E5FF" stroke-opacity=".45"/><text x="45.0" y="20" text-anchor="middle" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="14" fill="#00E5FF">Bi-LSTM</text></g></g>
</svg>
