<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Enzo Cherif — Software &amp; Automation Engineer, Robotics &amp; Embedded AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070F"/>
      <stop offset="1" stop-color="#0B1224"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.18" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx="0.88" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#FF2E97" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF2E97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.35" stop-color="#8B5CF6"/>
      <stop offset="0.65" stop-color="#FF2E97"/>
      <stop offset="1" stop-color="#00E5FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="640 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#00E5FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges"><rect width="1200" height="420" fill="url(#fadeX)"/></mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C2A44" stroke-width="1"/>
    </pattern>
    <pattern id="ties" width="36" height="20" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="14" height="20" rx="2" fill="#1A2540"/>
    </pattern>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="22"/></clipPath>
  </defs>

  <style>
    .mono { font-family: 'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace; }
    .sans { font-family: 'Segoe UI','Inter',-apple-system,'Helvetica Neue',Ubuntu,Arial,sans-serif; }
    .rise { opacity: 0; animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s } .d4 { animation-delay: 1.05s }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) } to { opacity: 1; transform: none } }

    .pulse { animation: pulse 1.6s ease-in-out infinite; transform-origin: 300px 70px; transform-box: fill-box; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

    .role { opacity: 0; animation: role 12s infinite; }
    .r2 { animation-delay: 4s } .r3 { animation-delay: 8s }
    @keyframes role {
      0%   { opacity: 0; transform: translateY(10px) }
      4%   { opacity: 1; transform: none }
      29%  { opacity: 1; transform: none }
      33%  { opacity: 0; transform: translateY(-10px) }
      100% { opacity: 0 }
    }

    .ties { animation: ties .9s linear infinite; }
    @keyframes ties { from { transform: translateX(0) } to { transform: translateX(-36px) } }

    .train { animation: train 5s cubic-bezier(.55,0,.45,1) infinite; }
    @keyframes train { 0% { transform: translateX(-520px) } 70%,100% { transform: translateX(1300px) } }

    .float { animation: float 7s ease-in-out infinite; }
    .f2 { animation-duration: 9s; animation-delay: -3s } .f3 { animation-duration: 11s; animation-delay: -6s }
    @keyframes float { 0%,100% { transform: translateY(0); opacity: .25 } 50% { transform: translateY(-22px); opacity: .9 } }

    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-60px) } to { transform: translateY(440px) } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)" opacity=".55" mask="url(#edges)"/>
    <rect width="1200" height="420" fill="url(#glowC)"/>
    <rect width="1200" height="420" fill="url(#glowM)"/>
    <rect class="scan" x="0" y="0" width="1200" height="60" fill="#00E5FF" opacity=".035"/>

    <!-- floating particles -->
    <g fill="#00E5FF">
      <circle class="float" cx="980" cy="90" r="2.2"/>
      <circle class="float f2" cx="1060" cy="170" r="1.6"/>
      <circle class="float f3" cx="1120" cy="70" r="2.6" fill="#FF2E97"/>
      <circle class="float f2" cx="880" cy="200" r="1.8" fill="#8B5CF6"/>
      <circle class="float" cx="160" cy="300" r="1.6" fill="#FF2E97"/>
      <circle class="float f3" cx="760" cy="60" r="1.6"/>
    </g>

    <!-- neural constellation -->
    <g class="rise d3">
      <g stroke="#26385C" stroke-width="1">
        <line x1="830" y1="95" x2="965" y2="70"/>
        <line x1="830" y1="95" x2="965" y2="130"/>
        <line x1="830" y1="95" x2="965" y2="185"/>
        <line x1="830" y1="95" x2="965" y2="240"/>
        <line x1="830" y1="95" x2="965" y2="300"/>
        <line x1="830" y1="155" x2="965" y2="70"/>
        <line x1="830" y1="155" x2="965" y2="130"/>
        <line x1="830" y1="155" x2="965" y2="185"/>
        <line x1="830" y1="155" x2="965" y2="240"/>
        <line x1="830" y1="155" x2="965" y2="300"/>
        <line x1="830" y1="215" x2="965" y2="70"/>
        <line x1="830" y1="215" x2="965" y2="130"/>
        <line x1="830" y1="215" x2="965" y2="185"/>
        <line x1="830" y1="215" x2="965" y2="240"/>
        <line x1="830" y1="215" x2="965" y2="300"/>
        <line x1="830" y1="275" x2="965" y2="70"/>
        <line x1="830" y1="275" x2="965" y2="130"/>
        <line x1="830" y1="275" x2="965" y2="185"/>
        <line x1="830" y1="275" x2="965" y2="240"/>
        <line x1="830" y1="275" x2="965" y2="300"/>
        <line x1="965" y1="70" x2="1100" y2="125"/>
        <line x1="965" y1="70" x2="1100" y2="185"/>
        <line x1="965" y1="70" x2="1100" y2="245"/>
        <line x1="965" y1="130" x2="1100" y2="125"/>
        <line x1="965" y1="130" x2="1100" y2="185"/>
        <line x1="965" y1="130" x2="1100" y2="245"/>
        <line x1="965" y1="185" x2="1100" y2="125"/>
        <line x1="965" y1="185" x2="1100" y2="185"/>
        <line x1="965" y1="185" x2="1100" y2="245"/>
        <line x1="965" y1="240" x2="1100" y2="125"/>
        <line x1="965" y1="240" x2="1100" y2="185"/>
        <line x1="965" y1="240" x2="1100" y2="245"/>
        <line x1="965" y1="300" x2="1100" y2="125"/>
        <line x1="965" y1="300" x2="1100" y2="185"/>
        <line x1="965" y1="300" x2="1100" y2="245"/>
      </g>
      <circle r="3" fill="#00E5FF" opacity="0"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M830 215 L965 130 L1100 185"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#8B5CF6" opacity="0"><animateMotion dur="2.4s" begin="0.55s" repeatCount="indefinite" path="M830 95 L965 70 L1100 245"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="0.55s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#FF2E97" opacity="0"><animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite" path="M830 95 L965 185 L1100 245"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#00E5FF" opacity="0"><animateMotion dur="2.4s" begin="1.65s" repeatCount="indefinite" path="M830 95 L965 300 L1100 125"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="1.65s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#8B5CF6" opacity="0"><animateMotion dur="2.4s" begin="2.2s" repeatCount="indefinite" path="M830 95 L965 70 L1100 185"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#FF2E97" opacity="0"><animateMotion dur="2.4s" begin="2.75s" repeatCount="indefinite" path="M830 275 L965 70 L1100 125"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="2.75s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#00E5FF" opacity="0"><animateMotion dur="2.4s" begin="3.3s" repeatCount="indefinite" path="M830 95 L965 300 L1100 185"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="3.3s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#8B5CF6" opacity="0"><animateMotion dur="2.4s" begin="3.85s" repeatCount="indefinite" path="M830 95 L965 300 L1100 125"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="3.85s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#FF2E97" opacity="0"><animateMotion dur="2.4s" begin="4.4s" repeatCount="indefinite" path="M830 155 L965 300 L1100 125"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="95" r="11" fill="#00E5FF" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-0.0s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="95" r="5" fill="#0B1224" stroke="#00E5FF" stroke-width="2"/>
      <circle cx="830" cy="155" r="11" fill="#00E5FF" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-0.37s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="155" r="5" fill="#0B1224" stroke="#00E5FF" stroke-width="2"/>
      <circle cx="830" cy="215" r="11" fill="#00E5FF" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-0.74s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="215" r="5" fill="#0B1224" stroke="#00E5FF" stroke-width="2"/>
      <circle cx="830" cy="275" r="11" fill="#00E5FF" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-1.11s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="275" r="5" fill="#0B1224" stroke="#00E5FF" stroke-width="2"/>
      <circle cx="965" cy="70" r="11" fill="#8B5CF6" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-1.48s" repeatCount="indefinite"/></circle>
      <circle cx="965" cy="70" r="5" fill="#0B1224" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="965" cy="130" r="11" fill="#8B5CF6" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-1.85s" repeatCount="indefinite"/></circle>
      <circle cx="965" cy="130" r="5" fill="#0B1224" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="965" cy="185" r="11" fill="#8B5CF6" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-2.22s" repeatCount="indefinite"/></circle>
      <circle cx="965" cy="185" r="5" fill="#0B1224" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="965" cy="240" r="11" fill="#8B5CF6" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-0.19s" repeatCount="indefinite"/></circle>
      <circle cx="965" cy="240" r="5" fill="#0B1224" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="965" cy="300" r="11" fill="#8B5CF6" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-0.56s" repeatCount="indefinite"/></circle>
      <circle cx="965" cy="300" r="5" fill="#0B1224" stroke="#8B5CF6" stroke-width="2"/>
      <circle cx="1100" cy="125" r="11" fill="#FF2E97" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-0.93s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="125" r="5" fill="#0B1224" stroke="#FF2E97" stroke-width="2"/>
      <circle cx="1100" cy="185" r="11" fill="#FF2E97" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-1.3s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="185" r="5" fill="#0B1224" stroke="#FF2E97" stroke-width="2"/>
      <circle cx="1100" cy="245" r="11" fill="#FF2E97" opacity=".12"><animate attributeName="r" values="9;14;9" dur="2.4s" begin="-1.67s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="245" r="5" fill="#0B1224" stroke="#FF2E97" stroke-width="2"/>
    </g>

    <!-- status pill -->
    <g class="rise d1">
      <rect x="70" y="52" width="520" height="38" rx="19" fill="#0F1A30" stroke="#22D3A5" stroke-opacity=".45"/>
      <circle cx="94" cy="71" r="6" fill="#22D3A5" opacity=".35" filter="url(#soft)"/>
      <circle class="pulse" cx="94" cy="71" r="4.5" fill="#22D3A5"/>
      <text x="110" y="76.5" class="mono" font-size="14.5" letter-spacing="1.5" fill="#B7F7E4">NOW · SOFTWARE &amp; AUTOMATION ENGINEER @ ALSTOM</text>
    </g>

    <!-- name -->
    <g class="rise d2">
      <text x="66" y="196" class="sans" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#name)" opacity=".55" filter="url(#blur)">Enzo Cherif</text>
      <text x="66" y="196" class="sans" font-size="104" font-weight="800" letter-spacing="-3" fill="url(#name)">Enzo Cherif</text>
    </g>

    <!-- rotating roles -->
    <g class="rise d3">
      <text x="72" y="246" class="mono" font-size="22" fill="#5B6B85">&gt;</text>
      <g class="mono" font-size="22" fill="#E6EDF3">
        <text class="role"    x="96" y="246">Robotics &amp; Embedded AI engineer</text>
        <text class="role r2" x="96" y="246">AI-driven automation for railway systems</text>
        <text class="role r3" x="96" y="246">Turning complex data into clear tools</text>
      </g>
    </g>

    <g class="rise d4 mono" font-size="14" fill="#8B98A9" letter-spacing="1">
      <text x="72" y="290">PITTSBURGH, USA   ·   RAILWAY ATS   ·   SEATECH · INP TOULON   ·   MASTER RISE</text>
    </g>

    <!-- railway -->
    <g transform="translate(0 344)">
      <g mask="url(#edges)">
        <rect class="ties" x="0" y="0" width="1260" height="20" fill="url(#ties)"/>
        <rect x="0" y="2" width="1200" height="3" fill="#2A3B5F"/>
        <rect x="0" y="15" width="1200" height="3" fill="#2A3B5F"/>
      </g>
      <g class="train">
        <rect x="0" y="-6" width="420" height="32" fill="url(#streak)" opacity=".35" filter="url(#blur)"/>
        <rect x="40" y="1" width="380" height="5" rx="2.5" fill="url(#streak)"/>
        <rect x="40" y="14" width="380" height="5" rx="2.5" fill="url(#streak)"/>
        <circle cx="420" cy="10" r="9" fill="#FFFFFF" filter="url(#soft)"/>
      </g>
    </g>

    <rect x=".5" y=".5" width="1199" height="419" rx="22" fill="none" stroke="#22324F"/>
  </g>
</svg>
