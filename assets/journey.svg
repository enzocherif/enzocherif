<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Journey: SeaTech INP Toulon (engineering degree), Master RISE (Robotics and Embedded AI), Alstom Pittsburgh (ATS software and automation, current), next: AI and industrial systems.">
  <defs>
    <linearGradient id="trk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/><stop offset=".1" stop-color="#8B5CF6"/>
      <stop offset=".62" stop-color="#00E5FF"/><stop offset=".8" stop-color="#FF2E97"/><stop offset="1" stop-color="#FF2E97" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <style>
    .halo { animation: 9s linear infinite; }
    @keyframes s0 { 0%,19.4% { transform: scale(1); opacity:.35 } 20.4% { transform: scale(2.4); opacity:1 } 34.4%,100% { transform: scale(1); opacity:.35 } }
    @keyframes s1 { 0%,39.1% { transform: scale(1); opacity:.35 } 40.1% { transform: scale(2.4); opacity:1 } 54.1%,100% { transform: scale(1); opacity:.35 } }
    @keyframes s2 { 0%,58.9% { transform: scale(1); opacity:.35 } 59.9% { transform: scale(2.4); opacity:1 } 73.9%,100% { transform: scale(1); opacity:.35 } }
    @keyframes s3 { 0%,78.6% { transform: scale(1); opacity:.35 } 79.6% { transform: scale(2.4); opacity:1 } 93.6%,100% { transform: scale(1); opacity:.35 } }
    .train { animation: tr 9s linear infinite; }
    @keyframes tr { from { transform: translateX(-160px) } to { transform: translateX(1360px) } }
  </style>
  <rect x="1" y="1" width="1198" height="258" rx="18" fill="#0A0F1C" stroke="#1C2A44"/>
  <rect x="40" y="108.5" width="1120" height="3" rx="1.5" fill="url(#trk)" opacity=".55"/>
  <path d="M900 110H1160" stroke="#0A0F1C" stroke-width="4" stroke-dasharray="2 10"/>
  <g class="train">
    <rect x="-150" y="102" width="160" height="16" fill="url(#trail)" opacity=".5" filter="url(#b)"/>
    <rect x="-130" y="108" width="140" height="4" rx="2" fill="url(#trail)"/>
    <circle cx="10" cy="110" r="7" fill="#fff"/>
    <circle cx="10" cy="110" r="14" fill="#00E5FF" opacity=".45" filter="url(#b)"/>
  </g>
    <g>
      <circle class="halo" style="animation-name:s0;transform-origin:150px 110px" cx="150" cy="110" r="16" fill="#8B5CF6" opacity=".35"/>
      <circle cx="150" cy="110" r="13" fill="#0A0F1C" stroke="#8B5CF6" stroke-width="3"/>
      <circle cx="150" cy="110" r="5" fill="#8B5CF6"/>
      <text x="150" y="166" text-anchor="middle" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="21" font-weight="700" fill="#E6EDF3">SeaTech · INP Toulon</text>
      <text x="150" y="194" text-anchor="middle" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="15" fill="#8B98A9">Engineering degree</text>
    </g>
    <g>
      <circle class="halo" style="animation-name:s1;transform-origin:450px 110px" cx="450" cy="110" r="16" fill="#8B5CF6" opacity=".35"/>
      <circle cx="450" cy="110" r="13" fill="#0A0F1C" stroke="#8B5CF6" stroke-width="3"/>
      <circle cx="450" cy="110" r="5" fill="#8B5CF6"/>
      <text x="450" y="166" text-anchor="middle" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="21" font-weight="700" fill="#E6EDF3">Master RISE</text>
      <text x="450" y="194" text-anchor="middle" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="15" fill="#8B98A9">Robotics &amp; Embedded AI</text>
    </g>
    <g>
      <circle class="halo" style="animation-name:s2;transform-origin:750px 110px" cx="750" cy="110" r="16" fill="#00E5FF" opacity=".35"/>
      <circle cx="750" cy="110" r="13" fill="#0A0F1C" stroke="#00E5FF" stroke-width="3"/>
      <circle cx="750" cy="110" r="5" fill="#00E5FF"/>
      <text x="750" y="166" text-anchor="middle" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="21" font-weight="700" fill="#E6EDF3">Alstom · Pittsburgh</text>
      <text x="750" y="194" text-anchor="middle" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="15" fill="#8B98A9">ATS software &amp; automation</text>
    <g transform="translate(750 52)">
      <rect x="-34" y="-15" width="68" height="26" rx="13" fill="#00E5FF" fill-opacity=".14" stroke="#00E5FF" stroke-opacity=".6"/>
      <text text-anchor="middle" y="3" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#00E5FF">NOW</text>
    </g>
    </g>
    <g>
      <circle class="halo" style="animation-name:s3;transform-origin:1050px 110px" cx="1050" cy="110" r="16" fill="#FF2E97" opacity=".35"/>
      <circle cx="1050" cy="110" r="13" fill="#0A0F1C" stroke="#FF2E97" stroke-width="3" stroke-dasharray="4 4"/>
      <circle cx="1050" cy="110" r="5" fill="#FF2E97"/>
      <text x="1050" y="166" text-anchor="middle" font-family="'Segoe UI','Inter',-apple-system,'Helvetica Neue',Ubuntu,Arial,sans-serif" font-size="21" font-weight="700" fill="#E6EDF3">What&#x27;s next</text>
      <text x="1050" y="194" text-anchor="middle" font-family="'SF Mono','Cascadia Code','JetBrains Mono',Consolas,'Liberation Mono',monospace" font-size="15" fill="#8B98A9">AI × industrial systems</text>
    </g>
</svg>
